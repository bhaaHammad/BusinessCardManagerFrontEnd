<mat-toolbar color="primary">
    <span>Business Cards</span>
    <span class="flex-spacer"></span>
    
    <button mat-icon-button [routerLink]="['/cards']" aria-label="View cards">
      <mat-icon>list</mat-icon>
    </button>
    
    <button mat-raised-button [routerLink]="['/cards/new']" color="accent">
      <mat-icon>add</mat-icon>
      Add Card
    </button>
    
    <button mat-raised-button [routerLink]="['/import']" color="accent">
      <mat-icon>upload</mat-icon>
      Import
    </button>
  </mat-toolbar>
